server {
    # Seul port publie vers l'hote. "ssl" active TLS dessus.
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name slidriss.42.fr;

    # Certificat auto-signe, genere au build par openssl.
    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    # Exigence du sujet : rien en dessous de TLS 1.2.
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Volume wp_data, partage avec le conteneur wordpress.
    root  /var/www/html;
    index index.php index.html;

    # Fichier, puis dossier, sinon on passe la main a WordPress.
    # C'est ce qui fait fonctionner les permaliens.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Tout ce qui finit par .php part vers php-fpm.
    location ~ \.php$ {
        include        fastcgi_params;
        # Nom du conteneur, resolu par le DNS du reseau docker.
        # Le port correspond au "listen" de www.conf.
        fastcgi_pass   wordpress:9000;
        fastcgi_index  index.php;
        # Chemin absolu du fichier a executer. Apres l'include,
        # pour que cette valeur l'emporte.
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}