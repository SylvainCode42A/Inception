# Nom du pool. php-fpm peut en gérer plusieurs, un par site, chacun avec
# son utilisateur et son port. Ici un seul. Ce nom apparaît dans ps -ef.
[www]

# Identité des processus enfants. Doit correspondre au propriétaire de
# /var/www/html, sinon WordPress ne peut pas écrire ses médias. Le master
# reste en root, uniquement pour pouvoir créer ces enfants sous www-data.
user = www-data
group = www-data

# La ligne la plus importante du fichier. Par défaut php-fpm écoute sur un
# socket Unix, c'est-à-dire un fichier — invisible depuis un autre conteneur,
# qui n'a pas le même système de fichiers. En TCP sur toutes les interfaces,
# nginx peut l'atteindre à wordpress:9000. Doit correspondre au fastcgi_pass
# de nginx.conf. Sans cette ligne : 502 Bad Gateway sur toutes les pages.
listen = 0.0.0.0:9000

# Réglage de performance, pas d'architecture. dynamic fait varier le nombre
# de processus selon la charge : 2 au démarrage, jamais moins d'1 ni plus de
# 3 au repos, 5 au maximum. max_children est aussi le nombre de requêtes PHP
# traitées simultanément — au-delà, elles patientent en file.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

# Par sécurité, php-fpm vide l'environnement avant d'exécuter du PHP.
# Ici ce n'est pas vital, wp-config.php contenant des valeurs littérales,
# mais ça le deviendrait si le code lisait les variables avec getenv().
clear_env = no